aid: ipsy
name: Ipsy
description: >-
  IPSY is a personalized beauty subscription company founded in 2011 by Michelle
  Phan, Marcelo Camberos, and Jennifer Goldfarb. Members take a detailed beauty
  quiz and receive monthly curated "Glam Bag" drops of deluxe samples and full-size
  makeup, skincare, hair, and fragrance products across tiers (Original, Boxycharm,
  and Ultimate). IPSY operates as a direct-to-consumer commerce and membership
  platform under the BFA Industries umbrella; it exposes no public developer API,
  running on internal GraphQL and REST services with Auth0-based consumer identity.
  This API Evangelist profile tracks IPSY's public web, security, and identity
  surface rather than a documented developer program.
